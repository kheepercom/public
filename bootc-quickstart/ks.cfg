# Installs the bootc image named on the kernel command line:
#   bootc.image=quay.io/you/app:latest   required
#   bootc.auth=<base64 of user:token>    private registries only
#   bootc.sshkey=<base64 of a public key> authorized for root
lang en_US.UTF-8
keyboard us
timezone UTC --utc
cmdline
network --bootproto=dhcp --device=link --activate
rootpw --lock

%include /tmp/bootc.ks
clearpart --all --initlabel --disklabel=gpt
reqpart --add-boot
part / --grow --fstype xfs

%pre --erroronfail
arg() { tr ' ' '\n' </proc/cmdline | sed -n "s/^bootc\.$1=//p"; }
image=$(arg image)
[ -n "$image" ] || { echo "bootc.image= is not on the kernel command line" >&2; exit 1; }
# One disk. Spread over two, the ESP lands on one and the root on the other,
# and bootupd, given the root's disk, finds no ESP and fails the install.
disk=$(lsblk -dnpo NAME,TYPE,RM | awk '$2 == "disk" && $3 == 0 && $1 !~ /zram/ {print $1; exit}')
{
	echo "ignoredisk --only-use=$(basename "$disk")"
	echo "bootc --source-imgref=registry:$image --target-imgref=$image"
} >/tmp/bootc.ks
auth=$(arg auth)
if [ -n "$auth" ]; then
	mkdir -p /etc/ostree
	echo "{\"auths\":{\"${image%%/*}\":{\"auth\":\"$auth\"}}}" >/etc/ostree/auth.json
fi
%end

# Anaconda's sshkey does nothing for a bootc install. The registry
# credentials are written again for the installed host to pull updates.
%post --erroronfail
arg() { tr ' ' '\n' </proc/cmdline | sed -n "s/^bootc\.$1=//p"; }
image=$(arg image)
auth=$(arg auth)
key=$(arg sshkey)
# Written by tmpfiles at boot, like bootc install --root-ssh-authorized-keys,
# so that it gets an SELinux label sshd can read.
if [ -n "$key" ]; then
	printf 'd /var/roothome/.ssh 0700 - - -\nf~ /var/roothome/.ssh/authorized_keys 0600 - - - %s\n' "$key" >/etc/tmpfiles.d/bootc-quickstart-ssh.conf
fi
if [ -n "$auth" ]; then
	install -d -m 0700 /etc/ostree
	echo "{\"auths\":{\"${image%%/*}\":{\"auth\":\"$auth\"}}}" >/etc/ostree/auth.json
	chmod 0600 /etc/ostree/auth.json
fi
%end

reboot
