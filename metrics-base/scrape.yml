global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vmsingle
    static_configs:
      - targets: ['127.0.0.1:8428']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: services
    file_sd_configs:
      - files: ['/etc/victoria-metrics/scrape.d/*.json']
