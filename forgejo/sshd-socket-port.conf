# Admin sshd listens on 2222 so Forgejo's built-in git SSH server can take the
# default port 22. systemd binds the socket, not sshd: SELinux only labels
# tcp/22 as ssh_port_t, and sshd_t may not name_bind anything else, so a
# long-running sshd -D on 2222 dies with "Cannot bind any address" under
# enforcing. init_t can bind any port_type, so socket activation sidesteps it.
[Socket]
ListenStream=
ListenStream=2222
