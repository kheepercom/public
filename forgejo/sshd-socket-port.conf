# Admin sshd listens on 2222 so Forgejo's built-in git SSH server can take the
# default port 22. Socket activation does NOT sidestep SELinux here: systemd
# derives a socket unit's label from the ExecStart binary of the service it
# activates, so this socket is bound as sshd_t, which may only name_bind
# ssh_port_t. tcp/2222 is labelled ssh_port_t in the Containerfile to match --
# without that the bind fails and this unit dies with "Result: resources".
[Socket]
ListenStream=
ListenStream=2222
