[Unit]
Wants=kheeper-object-proxy.service kheeper-walg-env.service
After=kheeper-object-proxy.service

[Service]
# Fedora's postgresql.service sets TimeoutSec=0 (no stop timeout). Combined with
# archive_command calling out to the network, a wedged wal-push hangs reboot
# forever. Cap shutdown so systemd SIGKILLs postmaster as a last resort; WAL
# replay handles recovery on next start.
TimeoutStopSec=120
